name: image-views

services:
  app:
    container_name: image-views-app
    image: image-views:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to "0" if you don't need 7z/rar support to reduce image size.
        INSTALL_ARCHIVE_TOOLS: "1"
    restart: unless-stopped
    ports:
      - "8290:8010"
    environment:
      TZ: Asia/Shanghai
      DB_PATH: /app/backend/data/app.db
      PHOTO_ROOT: /app/photos
      PHOTOS_DIR: /app/photos
      CACHE_DIR: /app/cache
    volumes:
      - /data/docker/image-views/data:/app/backend/data
      - /mnt/pool1/download/picture:/app/photos:ro
      - /data/docker/image-views/cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8010/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
