name: image-views

services:
  app:
    container_name: image-views-app
    image: image-views:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep archive support (7z/rar) enabled.
        INSTALL_ARCHIVE_TOOLS: "1"
    restart: unless-stopped
    ports:
      - "${IMAGE_VIEWS_PORT:-8480}:8010"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/backend/data
      - ./cache:/app/cache
      - /data/download/images:/app/photos:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
