name: image-views

services:
  app:
    container_name: image-views-app
    image: image-views:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep archive support (7z/rar) enabled.
        INSTALL_ARCHIVE_TOOLS: "1"
    restart: unless-stopped
    ports:
      - "8480:8010"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/backend/data
      - /data/download/images:/app/photos:ro
      - ./cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
