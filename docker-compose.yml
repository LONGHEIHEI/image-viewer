services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    volumes:
      - ./photos:/data/photos:ro
      - ./cache:/data/cache
      - ./data:/app/data
    environment:
      - PHOTO_ROOT=/data/photos
      - THUMB_CACHE=/data/cache
      - THUMB_SIZE=320
    ports:
      - "8080:80"
    restart: unless-stopped
